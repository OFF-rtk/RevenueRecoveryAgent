# A generic, target-independent Alembic configuration file.
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file's location
script_location = migrations

# Revision file naming — readable slug rather than random hex
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with the project root so `core` is importable
prepend_sys_path = .

# Timezone for created_date in migration file headers
timezone = UTC

# Max length of slug in file names
truncate_slug_length = 40

# version_path_separator: filesystem separator for version directories
version_path_separator = os

# sqlalchemy.url is intentionally left blank here.
# The env.py reads it from core.config.settings.database_url at runtime.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
