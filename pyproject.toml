[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenue-recovery-agent"
version = "0.1.0"
description = "Razorpay AI Buildathon 2026 — Revenue Recovery Agent core pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "groq>=0.9",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx2",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore:.*httpx.*starlette.*:DeprecationWarning",
]
markers = [
    "integration: tests that require external services (Postgres, Groq API) — run with: pytest -m integration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
